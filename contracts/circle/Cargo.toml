[package]
name = "circle"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Halka rotating savings circle (ROSCA) contract for Stellar Soroban"
repository = "https://github.com/fivauygn/halka"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
