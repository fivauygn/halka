name: Feature request
description: Suggest an improvement to Halka.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Note any effect on the contract or on fund safety.
    validations:
      required: true
